<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lew · Companion</title>
<style>
  :root { --acc:#23D6F5; --gold:#E8C766; --bg:#070B14; --fg:#DCE7F5; --fg2:#9fb0c4; --fg3:#64748B; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,'Segoe UI',sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; }
  body::before { content:''; position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(420px 260px at 50% -10%, rgba(35,214,245,.10), transparent 70%); }
  .head { display:flex; align-items:center; gap:10px; padding:14px 16px 8px; }
  .head .dot { width:8px;height:8px;border-radius:50%; }
  .head .dot.on { background:#34D399; box-shadow:0 0 8px #34D399; animation:pulse 2s infinite; }
  .head .dot.off { background:var(--fg3); }
  .head .t { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg2); font-family:ui-monospace,monospace; }
  @keyframes pulse { 50% { opacity:.4; } }
  .stage { text-align:center; padding:4px 0 0; position:relative; }
  .stage img { width:128px; height:128px; image-rendering:auto; animation:floaty 4.2s ease-in-out infinite; filter:drop-shadow(0 14px 14px rgba(0,0,0,.55)); }
  .stage.speaking img { animation:floaty 1.1s ease-in-out infinite; }
  .stage .halo { position:absolute; left:50%; top:108px; transform:translateX(-50%); width:96px; height:18px; border-radius:50%; background:radial-gradient(closest-side, rgba(35,214,245,.35), transparent); }
  @keyframes floaty { 0%,100% { transform:translateY(0);} 50% { transform:translateY(-7px);} }
  @media (prefers-reduced-motion: reduce){ .stage img{animation:none;} }
  .brief { flex:1; overflow-y:auto; padding:8px 16px 12px; }
  .sec { background:rgba(13,20,36,.66); border:1px solid rgba(35,214,245,.13); border-radius:14px; padding:10px 13px; margin-bottom:9px; backdrop-filter:blur(10px); }
  .sec h3 { margin:0 0 6px; font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-family:ui-monospace,monospace; color:var(--fg2); display:flex; align-items:center; gap:7px; }
  .sec.gold h3 { color:var(--gold); } .sec.gold { border-color:rgba(232,199,102,.35); box-shadow:0 0 14px rgba(232,199,102,.12); }
  .sec.mute { opacity:.62; }
  .sec li { font-size:12.5px; color:var(--fg); margin:3px 0; list-style:none; }
  .sec ul { margin:0; padding:0; }
  .chat { padding:10px 14px 14px; border-top:1px solid rgba(35,214,245,.12); background:rgba(7,11,20,.9); }
  .reply { font-size:12.5px; color:var(--fg); background:rgba(35,214,245,.07); border:1px solid rgba(35,214,245,.18); border-radius:12px; padding:8px 11px; margin-bottom:9px; max-height:110px; overflow-y:auto; display:none; }
  .row { display:flex; gap:8px; }
  input { flex:1; background:rgba(13,20,36,.8); border:1px solid rgba(35,214,245,.22); border-radius:11px; color:var(--fg); padding:9px 12px; font-size:13px; outline:none; }
  input:focus { border-color:rgba(35,214,245,.55); }
  button { background:rgba(35,214,245,.14); color:var(--acc); border:1px solid rgba(35,214,245,.4); border-radius:11px; padding:0 13px; cursor:pointer; font-size:13px; }
  button:hover { background:rgba(35,214,245,.22); }
  button.ghost { background:transparent; color:var(--fg2); border-color:rgba(100,116,139,.3); }
  button.ghost.on { color:var(--acc); border-color:rgba(35,214,245,.4); }
  .foot { display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:10px; color:var(--fg3); font-family:ui-monospace,monospace; }
</style>
</head>
<body>
  <div class="head"><span class="dot off" id="dot"></span><span class="t" id="title">Companion · connecting…</span></div>
  <div class="stage" id="stage"><div class="halo"></div><img id="avatar" src="assets/char-lew.png" alt="Legacy Lew"/></div>
  <div class="brief" id="brief"></div>
  <div class="chat">
    <div class="reply" id="reply"></div>
    <div class="row">
      <input id="msg" placeholder="Ask Lew anything…" aria-label="Ask the twin"/>
      <button id="send" title="Send">↩</button>
      <button id="voice" class="ghost" title="Speak replies aloud">🔊</button>
    </div>
    <div class="foot">
      <span id="model">twin: checking…</span>
      <span><button class="ghost" id="notify" style="font-size:10px;padding:3px 8px;">enable alerts</button></span>
    </div>
  </div>
<script>
(function () {
  const API = location.origin;
  const $ = id => document.getElementById(id);
  let speakOn = localStorage.getItem('mcCompanionSpeak') === '1';
  let twinOnline = false;
  updateVoiceBtn();

  function updateVoiceBtn(){ $('voice').className = 'ghost' + (speakOn ? ' on' : ''); }
  $('voice').onclick = () => { speakOn = !speakOn; localStorage.setItem('mcCompanionSpeak', speakOn ? '1' : '0'); updateVoiceBtn(); };

  function speak(text){
    if (!speakOn) return;
    $('stage').classList.add('speaking');
    // premium voice if configured, browser voice otherwise — honest fallback
    fetch(API + '/api/tts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text }) })
      .then(r => { if (!r.ok) throw 0; return r.blob(); })
      .then(b => { const a = new Audio(URL.createObjectURL(b)); a.onended = done; a.play().catch(done); })
      .catch(() => {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.rate = 1.0; u.pitch = 0.92; u.onend = done;
          speechSynthesis.cancel(); speechSynthesis.speak(u);
        } catch (e) { done(); }
      });
    function done(){ $('stage').classList.remove('speaking'); }
  }

  // ---- twin status + brief ----
  function loadStatus(){
    fetch(API + '/api/twin/status').then(r => r.json()).then(s => {
      twinOnline = s.online;
      $('model').textContent = s.online ? ('twin: ' + s.model) : 'twin offline — set ANTHROPIC_API_KEY';
      $('title').textContent = (s.displayName || 'Companion') + (s.online ? ' · online' : ' · brief only');
    }).catch(() => { $('title').textContent = 'Companion · backend offline'; });
  }
  function loadBrief(){
    fetch(API + '/api/brief').then(r => r.json()).then(b => {
      $('dot').className = 'dot on';
      const el = $('brief'); el.innerHTML = '';
      b.sections.forEach(s => {
        const d = document.createElement('div');
        d.className = 'sec ' + (s.tone === 'gold' ? 'gold' : s.tone === 'mute' ? 'mute' : '');
        const h = document.createElement('h3'); h.textContent = s.title; d.appendChild(h);
        const ul = document.createElement('ul');
        s.lines.forEach(l => { const li = document.createElement('li'); li.textContent = l; ul.appendChild(li); });
        d.appendChild(ul); el.appendChild(d);
      });
    }).catch(() => {
      $('dot').className = 'dot off';
      $('brief').innerHTML = '<div class="sec mute"><h3>Backend offline</h3><ul><li>Start Mission Control: npm start</li></ul></div>';
    });
  }
  loadStatus(); loadBrief();
  setInterval(loadBrief, 90000);

  // ---- ask the twin ----
  function send(){
    const t = $('msg').value.trim(); if (!t) return;
    $('msg').value = ''; const r = $('reply');
    r.style.display = 'block'; r.textContent = '…';
    fetch(API + '/api/twin/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text: t }) })
      .then(x => x.json()).then(j => {
        r.textContent = j.reply || j.error || 'no reply';
        if (j.reply) speak(j.reply);
      }).catch(e => { r.textContent = 'error: ' + e; });
  }
  $('send').onclick = send;
  $('msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

  // ---- live alerts (SSE → system notifications) ----
  $('notify').onclick = () => Notification.requestPermission().then(p => {
    $('notify').textContent = p === 'granted' ? 'alerts on' : 'alerts blocked';
  });
  function notify(title, body){
    if (Notification.permission === 'granted') new Notification(title, { body, icon: 'assets/la-symbol.png' });
  }
  try {
    const es = new EventSource(API + '/api/stream');
    es.onmessage = (e) => {
      let evt; try { evt = JSON.parse(e.data); } catch { return; }
      if (evt.type === 'approval' && evt.approval && evt.approval.state === 'pending') {
        notify('Approval needs you', evt.approval.subject + ' — ' + evt.approval.by + ' (' + (evt.approval.risk || 'low') + ' risk)');
        loadBrief();
      }
      if (evt.type === 'approval' && evt.approval && evt.approval.state !== 'pending') loadBrief();
      if (evt.type === 'agent') loadBrief();
      if (evt.type === 'chat' && evt.message && evt.message.role === 'system') {
        notify('Mission Control', evt.message.text);
      }
    };
  } catch (e) { /* offline — brief poll still works */ }
})();
</script>
</body>
</html>
